<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flights — Grizzly Travel</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:#0d0d0d; color:#eee; font-family: Arial, sans-serif; }

  /* ---- nav (matches nav-snippet.html) ---- */
  .gt-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 5%; background:#0a0a0a; border-bottom: 1px solid #262626;
  }
  .gt-brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .gt-brand img{ width:44px; height:44px; }
  .gt-brand-text{ font-size:22px; }
  .gt-brand-text .g{ color:#d4af37; font-weight:700; font-family: Georgia, serif; }
  .gt-brand-text .t{ color:#f5f5f5; font-style:italic; font-family: Georgia, serif; }
  .gt-links{ display:flex; gap:28px; }
  .gt-links a{
    color:#f5f5f5; text-decoration:none; font-size:13px;
    letter-spacing:1.5px; text-transform:uppercase;
  }
  .gt-links a.active, .gt-links a:hover{ color:#d4af37; }

  /* ---- page content ---- */
  .flights-hero{ padding: 60px 5% 20px; text-align:center; }
  .flights-hero h1{
    font-family: Georgia, serif; color:#f5d67a; font-size:34px; margin-bottom:10px;
  }
  .flights-hero p{ color:#aaa; font-size:15px; }

  .flight-form{
    max-width: 560px; margin: 40px auto 80px;
    background:#141414; border:1px solid #262626; border-radius:12px; padding:34px;
  }
  .row{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .field{ flex:1; min-width:200px; }
  label{ display:block; font-size:13px; color:#f5d67a; margin-bottom:6px; letter-spacing:1px; }
  input, select{
    width:100%; padding:11px 12px; background:#0d0d0d; border:1px solid #333;
    border-radius:6px; color:#eee; font-size:14px;
  }
  input:focus, select:focus{ outline:none; border-color:#d4af37; }
  .submit-btn{
    width:100%; padding:14px; background:#d4af37; color:#0d0d0d; border:none;
    border-radius:6px; font-weight:700; letter-spacing:2px; font-size:14px;
    cursor:pointer; margin-top:6px; text-transform:uppercase;
  }
  .submit-btn:hover{ background:#f5d67a; }

  footer{ text-align:center; padding:30px 5%; background:#0a0a0a; color:#888; font-size:13px; }
</style>
</head>
<body>

<nav class="gt-nav">
  <a href="index.html" class="gt-brand">
    <img src="logo.svg" alt="Grizzly Travel logo">
    <span class="gt-brand-text"><span class="g">Grizzly</span><span class="t">Travel</span></span>
  </a>
  <div class="gt-links">
    <a href="index.html">Home</a>
    <a href="packages.html">Packages</a>
    <a href="flights.html" class="active">Flights</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<div class="flights-hero">
  <h1>Book Domestic &amp; International Flights</h1>
  <p>Tell us your travel details and we'll send you the best fares via WhatsApp</p>
</div>

<form class="flight-form" id="flightForm">
  <div class="row">
    <div class="field">
      <label>Flight Type</label>
      <select id="flightType">
        <option value="Domestic">Domestic</option>
        <option value="International">International</option>
      </select>
    </div>
    <div class="field">
      <label>Trip Type</label>
      <select id="tripType">
        <option value="One-way">One-way</option>
        <option value="Round-trip">Round-trip</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>From</label>
      <input type="text" id="fromCity" placeholder="e.g. Nairobi (NBO)" required>
    </div>
    <div class="field">
      <label>To</label>
      <input type="text" id="toCity" placeholder="e.g. Mombasa (MBA)" required>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>Departure Date</label>
      <input type="date" id="departDate" required>
    </div>
    <div class="field">
      <label>Return Date (if applicable)</label>
      <input type="date" id="returnDate">
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>Passengers</label>
      <input type="number" id="pax" min="1" value="1" required>
    </div>
    <div class="field">
      <label>Your Name</label>
      <input type="text" id="custName" placeholder="Full name" required>
    </div>
  </div>

  <button type="submit" class="submit-btn">Send Enquiry via WhatsApp</button>
</form>

<footer>&copy; 2026 Grizzly Travel &middot; Kenya Safari &amp; Cultural Tourism</footer>

<script>
  document.getElementById('flightForm').addEventListener('submit', function(e){
    e.preventDefault();
    const flightType = document.getElementById('flightType').value;
    const tripType = document.getElementById('tripType').value;
    const from = document.getElementById('fromCity').value;
    const to = document.getElementById('toCity').value;
    const depart = document.getElementById('departDate').value;
    const ret = document.getElementById('returnDate').value;
    const pax = document.getElementById('pax').value;
    const name = document.getElementById('custName').value;

    let msg = `Hello Grizzly Travel, I'd like to enquire about a flight booking:\n\n`;
    msg += `Name: ${name}\n`;
    msg += `Flight Type: ${flightType}\n`;
    msg += `Trip Type: ${tripType}\n`;
    msg += `From: ${from}\n`;
    msg += `To: ${to}\n`;
    msg += `Departure: ${depart}\n`;
    if(ret){ msg += `Return: ${ret}\n`; }
    msg += `Passengers: ${pax}`;

    const phone = "254XXXXXXXXX"; // <-- replace with your real WhatsApp number
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  });
</script>

</body>
</html>
